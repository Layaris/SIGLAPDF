# Crea la chiave di firma Android su GitHub, senza installare niente sul computer.
# Si avvia a mano UNA VOLTA (Actions › Crea chiave di firma › Run workflow).
#
# Prima servono due secret (Settings › Secrets and variables › Actions):
#   DMRELEASES_TOKEN           token fine-grained con Contents (read/write) e Secrets (read/write)
#                              su Layaris/SIGLAPDF e Layaris/DMReleases
#   ANDROID_KEYSTORE_PASSWORD  password della chiave scelta da te (almeno 16 caratteri), da conservare
#
# Il workflow crea il keystore, salva nei secret ANDROID_KEYSTORE_BASE64, ANDROID_KEY_PASSWORD e
# ANDROID_KEY_ALIAS e lascia per 1 giorno un artifact "sigla-chiave-backup" da scaricare e conservare.
# Il repository è pubblico: il file è protetto dalla password, per questo deve essere lunga.
name: Crea chiave di firma

on:
  workflow_dispatch:
    inputs:
      sovrascrivi:
        description: "Sostituisci una chiave già esistente (ATTENZIONE: gli aggiornamenti non si installeranno più sopra le versioni vecchie)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  crea:
    name: Crea il keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.DMRELEASES_TOKEN }}
      PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ESISTE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      REPO: ${{ github.repository }}
    steps:
      - name: Controlli
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Manca il secret DMRELEASES_TOKEN"; exit 1; fi
          if [ ${#PASS} -lt 16 ]; then echo "::error::ANDROID_KEYSTORE_PASSWORD manca o è più corta di 16 caratteri"; exit 1; fi
          if [ "$ESISTE" = "true" ] && [ "${{ inputs.sovrascrivi }}" != "true" ]; then
            echo "::error::Esiste già una chiave (ANDROID_KEYSTORE_BASE64). Non la sostituisco."; exit 1
          fi
      - name: Crea il keystore
        run: |
          keytool -genkeypair -keystore sigla-release.jks -storetype PKCS12 -alias sigla \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env PASS -keypass:env PASS \
            -dname "CN=Sigla, O=DM Releases, C=IT"
          keytool -list -keystore sigla-release.jks -storepass:env PASS | grep -i "sigla"
      - name: Salva nei secret
        run: |
          base64 -w0 sigla-release.jks | gh secret set ANDROID_KEYSTORE_BASE64 --repo "$REPO"
          printf '%s' "$PASS" | gh secret set ANDROID_KEY_PASSWORD --repo "$REPO"
          printf 'sigla' | gh secret set ANDROID_KEY_ALIAS --repo "$REPO"
          gh secret list --repo "$REPO"
      - name: Backup da scaricare (1 giorno)
        uses: actions/upload-artifact@v4
        with:
          name: sigla-chiave-backup
          path: sigla-release.jks
          retention-days: 1
