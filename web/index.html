<!DOCTYPE html>
<html lang="it">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sigla: compila e firma PDF. Tutto resta sul tuo dispositivo.">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1420" media="(prefers-color-scheme: dark)">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sigla">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sigla</title>
  <link rel="manifest" href="manifest.json">

  <!-- pdf.js incluso nella web app (render delle pagine offline, nessuna richiesta a CDN). -->
  <!-- Deve iniziare con "./": import() rifiuta gli specificatori "nudi" come "pdfjs/". -->
  <script>var dartPdfJsBaseUrl = "./pdfjs/";</script>
  <style>
    html, body { margin: 0; background: #F6F7F9; }
    @media (prefers-color-scheme: dark) { html, body { background: #0F1420; } }
  </style>
</head>
<body>
  <script>
    // Service worker (sigla_sw.js): dopo la prima apertura l'app si apre anche senza internet.
    // Una versione nuova si prepara in sottofondo e si attiva qui all'apertura dopo, tutta insieme
    // (la pagina si ricarica una volta da sola); se è pronta nei primi secondi, subito.
    if ('serviceWorker' in navigator) {
      var hadController = !!navigator.serviceWorker.controller;
      var reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController || reloaded) return; // alla primissima apertura non serve ricaricare
        reloaded = true;
        window.location.reload();
      });
      window.addEventListener('load', function () {
        var started = Date.now();
        navigator.serviceWorker.register('sigla_sw.js').then(function (reg) {
          if (!hadController) {
            // Prima apertura: i file già caricati (motore grafico, font) vanno nella copia.
            navigator.serviceWorker.ready.then(function (r) {
              var send = function () {
                var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
                if (r.active) r.active.postMessage({ type: 'sigla-cache', urls: urls });
              };
              if (document.body.dataset.siglaReady) send();
              else window.addEventListener('flutter-first-frame', send, { once: true });
            });
            return;
          }
          if (reg.waiting) reg.waiting.postMessage('sigla-activate');
          reg.addEventListener('updatefound', function () {
            var w = reg.installing;
            if (!w) return;
            w.addEventListener('statechange', function () {
              if (w.state === 'installed' && Date.now() - started < 10000) w.postMessage('sigla-activate');
            });
          });
        }).catch(function () {});
      });
    }
  </script>
  <script>window.addEventListener('flutter-first-frame', function () { document.body.dataset.siglaReady = '1'; });</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
